<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>工程相機</title>
<meta name="theme-color" content="#0f6b5a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="工程相機">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f4f5f2; --card:#fff; --ink:#1b1f1d; --muted:#6b726e; --line:#e1e4df;
  --accent:#0f6b5a; --accent-ink:#fff; --chip:#eef0ec; --warn:#b3261e; --ok:#2e9d6a; --wait:#c07f00;
  --r:14px; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121513;--card:#1c201e;--ink:#eef1ee;--muted:#9aa39e;--line:#2c322f;--accent:#3fbf9f;--accent-ink:#06231c;--chip:#262b28;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;font-size:16px;line-height:1.5}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.app{max-width:760px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 120px)}
header.top{display:flex;align-items:center;gap:10px;padding:10px 0 12px}
header.top h1{font-size:22px;margin:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--muted);font-size:14px}
.iconbtn{border:0;background:var(--card);border-radius:12px;width:42px;height:42px;display:inline-grid;place-items:center;box-shadow:var(--shadow);flex:none}
.iconbtn svg{width:22px;height:22px}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:#aaa;flex:none}
.dot.ok{background:var(--ok)}.dot.wait{background:var(--wait)}.dot.err{background:var(--warn)}
.banner{border-radius:12px;padding:12px;font-size:14px;margin-bottom:12px;display:flex;gap:10px;align-items:center;background:#fff4d6;color:#5b4300}
.banner.info{background:#e3f1ec;color:#0b4a3e}
@media (prefers-color-scheme:dark){.banner{background:#3a3014;color:#f3dc9a}.banner.info{background:#183129;color:#bfe9dc}}
.banner span{flex:1}
.banner button{border:0;border-radius:10px;padding:8px 12px;background:var(--accent);color:var(--accent-ink);font-weight:700;flex:none}
.sites,.photos{display:grid;gap:10px}
.site,.photo{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);display:flex;gap:12px;padding:10px;border:0;text-align:left;width:100%;align-items:center}
.cover{width:64px;height:64px;border-radius:10px;background:var(--chip);flex:none;object-fit:cover;display:grid;place-items:center;font-size:26px}
.site .name{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{flex:1;min-width:0}
.empty{text-align:center;color:var(--muted);padding:48px 16px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:14px}
.pill.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.photo{align-items:flex-start}
.photo .th{width:96px;height:96px;border-radius:10px;object-fit:cover;flex:none;background:var(--chip)}
.no{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.04em}
.note{white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.note.none{color:var(--muted);font-style:italic}
.small{font-size:12px;color:var(--muted)}
.pin{font-size:12px;color:var(--accent)}
.drv{font-size:12px}.drv.ok{color:var(--ok)}.drv.wait{color:var(--wait)}.drv.err{color:var(--warn)}
.grid .photos{grid-template-columns:repeat(3,1fr);gap:6px}
.grid .photo{padding:0;flex-direction:column;gap:0;overflow:hidden}
.grid .photo .th{width:100%;height:auto;aspect-ratio:1;border-radius:0}
.grid .photo .meta{padding:6px 8px 8px}
.grid .photo .note{-webkit-line-clamp:2;font-size:13px}
.grid .photo .small,.grid .photo .pin{display:none}
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(env(safe-area-inset-bottom) + 14px);background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:5}
.dock .inner{max-width:760px;margin:0 auto;display:flex;gap:10px}
.big{flex:1;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:18px;padding:16px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 20px rgba(15,107,90,.3)}
.big svg{width:26px;height:26px}
.ghost{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:0 16px;font-weight:500;display:flex;align-items:center;gap:6px}
.ghost svg{width:22px;height:22px}
.gpsbar{font-size:13px;color:var(--muted);margin:-6px 0 12px;display:flex;align-items:center;gap:6px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:760px;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px)}
.sheet h2{margin:0 0 10px;font-size:18px}
.preview{width:100%;max-height:44vh;object-fit:contain;border-radius:12px;background:#000;display:block}
.strip{display:flex;gap:6px;overflow-x:auto;margin:8px 0}
.strip img{width:56px;height:56px;object-fit:cover;border-radius:8px;opacity:.5;border:2px solid transparent;flex:none}
.strip img.cur{opacity:1;border-color:var(--accent)}
label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
textarea,input[type=text],input[type=date]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-size:16px;outline:none}
textarea:focus,input:focus{border-color:var(--accent)}
textarea{min-height:96px;resize:vertical}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:0;background:var(--chip);border-radius:999px;padding:6px 12px;font-size:14px}
.row{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:16px;background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--chip);color:var(--ink)}
.btn.danger{background:transparent;color:var(--warn);border:1px solid var(--line);flex:none;padding:14px 16px}
.mic{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 12px;display:inline-flex;gap:6px;align-items:center;font-size:14px;margin-top:8px}
.mic.on{background:var(--warn);color:#fff;border-color:var(--warn)}
.mic svg{width:18px;height:18px}
.gps{font-size:13px;color:var(--muted);margin-top:8px}
.navrow{display:flex;justify-content:space-between;align-items:center;margin:4px 0 8px}
.menu{display:grid;gap:8px}
.menu button,.menu a{text-align:left;border:0;background:var(--chip);border-radius:12px;padding:14px;font-size:16px;text-decoration:none;color:var(--ink);display:block}
.menu small{display:block;color:var(--muted);font-size:13px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.hidden{display:none!important}
.photo{position:relative}
.check{position:absolute;top:8px;left:8px;width:28px;height:28px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35);display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px;z-index:2;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.photo.picked{outline:3px solid var(--accent);outline-offset:-3px}
.photo.picked .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.selbar{display:flex;gap:8px;width:100%}
.selbar button{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px 10px;font-weight:700;font-size:15px;flex:1}
.selbar .del{background:var(--warn);color:#fff;border-color:var(--warn)}
.selbar .del:disabled,.selbar button:disabled{opacity:.4}
.coord{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;font-size:13px}
.coord code{background:var(--chip);border-radius:8px;padding:4px 8px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.cp{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 10px;font-size:13px}
.markbtn{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 12px;font-size:14px;margin-top:8px;margin-right:6px}
.editor{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column;color:#fff}
.etop{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px}
.etop button{border:0;border-radius:10px;padding:8px 14px;font-weight:700;background:#333;color:#fff}
.etop .primary{background:#3fbf9f;color:#06231c}
.estage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px}
.estage canvas{max-width:100%;max-height:100%;touch-action:none;display:block}
.etools{padding:8px 10px calc(env(safe-area-inset-bottom) + 10px);display:grid;gap:8px;background:#111}
.erow{display:flex;gap:6px;overflow-x:auto;align-items:center}
.erow button{border:0;border-radius:10px;padding:8px 12px;background:#2a2a2a;color:#fff;font-size:14px;flex:none}
.erow button.on{background:#3fbf9f;color:#06231c;font-weight:700}
.sw{width:30px;height:30px;border-radius:50%!important;padding:0!important;border:3px solid #2a2a2a!important}
.sw.on{border-color:#fff!important}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="iconbtn hidden" id="backBtn" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>

    <button id="selAll">全選</button><button id="selAlbum">📥 相簿</button><button id="selDel" class="del">刪除</button><button id="selCancel">取消</button>

    <button class="big" id="shootBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>拍照</button>

<input type="file" id="camInput" accept="image/*" capture="environment" class="hidden">
<input type="file" id="galInput" accept="image/*" multiple class="hidden">

<div class="scrim" id="siteSheet"><div class="sheet">

<div class="scrim" id="detailSheet"><div class="sheet">
  <div class="navrow">

<div class="editor hidden" id="editor">

<script>
/* ============ 設定 ============ */
const CLIENT_ID = "262376260711-bje9oqh7fs3gtkj10bdeban1ck157o0k.apps.googleusercontent.com";   // Google OAuth 用戶端 ID
const SCOPE = "https://www.googleapis.com/auth/drive.file";
const ROOT_FOLDER_NAME = "工程相機";
const CHIPS = ["人孔","管線","路面","既有設施","障礙物","量測","施工空間","待確認","需補拍"];

(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* ============ IndexedDB ============ */
let idb;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open("sitecam",1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("sites",{keyPath:"id"});const p=d.createObjectStore("photos",{keyPath:"id"});p.createIndex("site","siteId");d.createObjectStore("kv");d.createObjectStore("tomb",{keyPath:"id"})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function tx(store,mode,fn){return new Promise((res,rej)=>{const t=idb.transaction(store,mode);const s=t.objectStore(store);let out;const r=fn(s);if(r&&"onsuccess" in r)r.onsuccess=()=>{out=r.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
const dbGet=(st,k)=>tx(st,"readonly",s=>s.get(k));
const dbPut=(st,v)=>tx(st,"readwrite",s=>s.put(v));
const dbDel=(st,k)=>tx(st,"readwrite",s=>s.delete(k));
const dbAll=st=>tx(st,"readonly",s=>s.getAll());
const dbBySite=id=>tx("photos","readonly",s=>s.index("site").getAll(id));
const kvGet=k=>tx("kv","readonly",s=>s.get(k));
const kvSet=(k,v)=>tx("kv","readwrite",s=>s.put(v,k));

/* ============ 狀態 ============ */
let sites=[], photos=[], curSite=null, layout="list", newestFirst=true;
let selMode=false; const sel=new Set();
let token=null, tokenExp=0, tokenClient=null, gisReady=false, syncing=false, syncAgain=false;

function safeTitle(t){return String(t||"").replace(/[\\/:*?"<>|\r\n\t]+/g," ").trim()}

/* WGS84 → TWD97 TM2（GRS80，本島 121°，澎湖金馬 119°）*/
function toTWD97(lat,lng){
  const a=6378137,f=1/298.257222101,k0=0.9999,dx=250000,e2=f*(2-f),ep2=e2/(1-e2);
  const zone=lng<120?119:121,l0=zone*Math.PI/180,phi=lat*Math.PI/180,lam=lng*Math.PI/180;
  const sn=Math.sin(phi),c=Math.cos(phi),t=Math.tan(phi),N=a/Math.sqrt(1-e2*sn*sn),T=t*t,C=ep2*c*c,A=(lam-l0)*c,e4=e2*e2,e6=e4*e2;
  const M=a*((1-e2/4-3*e4/64-5*e6/256)*phi-(3*e2/8+3*e4/32+45*e6/1024)*Math.sin(2*phi)+(15*e4/256+45*e6/1024)*Math.sin(4*phi)-(35*e6/3072)*Math.sin(6*phi));
  const x=dx+k0*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*ep2)*A**5/120);
  const y=k0*(M+N*t*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*ep2)*A**6/720));
  return {x:+x.toFixed(3),y:+y.toFixed(3),zone};
}
function twd(p){return p&&p.lat!=null?toTWD97(p.lat,p.lng):null}
function twdText(p){const t=twd(p);return t?`${t.x.toFixed(3)},${t.y.toFixed(3)}`:""}
function twdLabel(p){const t=twd(p);return t?`TWD97${t.zone===119?"(119°)":""} X ${t.x.toFixed(3)}  Y ${t.y.toFixed(3)}`:""}
async function copyText(t,msg){try{await navigator.clipboard.writeText(t);toast(msg)}catch{const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast(msg)}catch{toast("無法複製")}ta.remove()}}

}
function parseLL(s){s=String(s||"").trim();if(!s)return null;const m=s.match(/@?(-?\d{1,2}(?:\.\d+)?)\s*[,，\s]\s*(-?\d{1,3}(?:\.\d+)?)/);if(!m)return undefined;const lat=+m[1],lng=+m[2];if(Math.abs(lat)>90||Math.abs(lng)>180)return undefined;return {lat:+lat.toFixed(7),lng:+lng.toFixed(7)}}
function gpsHtml(p){if(p&&p.lat!=null)return `📍 <a href="${mapUrl(p)}" target="_blank" rel="noopener">${llText(p)}</a>${p.acc?` <span class="small">（誤差約 ${Math.round(p.acc)} 公尺${p.gpsSrc==="exif"?"，取自照片":p.gpsSrc==="device"?"，取自手機定位":""}）</span>`:p.gpsSrc==="exif"?' <span class="small">（取自照片）</span>':""}`;return "📍 沒有 GPS，可在下方輸入或貼上座標"}

/* ============ EXIF（照片內的 GPS 與拍攝時間）============ */
async function readExif(file){try{const dv=new DataView(await file.slice(0,512*1024).arrayBuffer());if(dv.getUint16(0)!==0xFFD8)return{};let off=2;
  while(off+4<dv.byteLength){const mk=dv.getUint16(off);if(mk===0xFFDA)break;const len=dv.getUint16(off+2);if(mk===0xFFE1&&dv.getUint32(off+4)===0x45786966)return parseTiff(dv,off+10);off+=2+len}}catch{}return{}}
function parseTiff(dv,t){const out={};try{const le=dv.getUint16(t)===0x4949,u16=o=>dv.getUint16(o,le),u32=o=>dv.getUint32(o,le);
  const ifd=o=>{const n=u16(o),m={};for(let i=0;i<n;i++){const e=o+2+i*12;m[u16(e)]={count:u32(e+4),e}}return m};
  const ascii=en=>{const off=en.count<=4?en.e+8:t+u32(en.e+8);let s="";for(let i=0;i<en.count;i++){const c=dv.getUint8(off+i);if(!c)break;s+=String.fromCharCode(c)}return s};
  const rats=en=>{const off=t+u32(en.e+8),a=[];for(let i=0;i<en.count;i++){const d=u32(off+i*8+4);a.push(d?u32(off+i*8)/d:0)}return a};
  const i0=ifd(t+u32(t+4));
  if(i0[0x8825]){const g=ifd(t+u32(i0[0x8825].e+8));if(g[2]&&g[4]){const la=rats(g[2]),lo=rats(g[4]);let lat=la[0]+(la[1]||0)/60+(la[2]||0)/3600,lng=lo[0]+(lo[1]||0)/60+(lo[2]||0)/3600;if(g[1]&&ascii(g[1])==="S")lat=-lat;if(g[3]&&ascii(g[3])==="W")lng=-lng;if((lat||lng)&&Math.abs(lat)<=90&&Math.abs(lng)<=180){out.lat=+lat.toFixed(7);out.lng=+lng.toFixed(7)}}}
  if(i0[0x8769]){const x=ifd(t+u32(i0[0x8769].e+8));if(x[0x9003]){const m=ascii(x[0x9003]).match(/(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d):(\d\d)/);if(m)out.time=new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5],+m[6]).getTime()}}}catch{}return out}

  geoWatch=navigator.geolocation.watchPosition(pos=>{lastFix={lat:+pos.coords.latitude.toFixed(7),lng:+pos.coords.longitude.toFixed(7),acc:pos.coords.accuracy,t:Date.now()};geoDenied=false;renderGpsBar()},
    err=>{if(err.code===1)geoDenied=true;renderGpsBar()},{enableHighAccuracy:true,maximumAge:15000,timeout:30000});
}

/* ============ Google 登入（Google Identity Services）============ */
function loadGis(){return new Promise((res,rej)=>{if(window.google&&google.accounts&&google.accounts.oauth2)return res();const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.async=true;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
let loginWaiters=[];
async function initGis(){
  if(gisReady||CLIENT_ID.startsWith("__"))return;
  await loadGis();
  tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPE,
    callback:r=>{if(r&&r.access_token){token=r.access_token;tokenExp=Date.now()+((r.expires_in||3600)-120)*1000;try{sessionStorage.setItem("tok",JSON.stringify({token,tokenExp}))}catch{};kvSet("authed",true);renderBanners();setStatus();loginWaiters.splice(0).forEach(f=>f(true));sync()}
      else loginWaiters.splice(0).forEach(f=>f(false))},
    error_callback:e=>{loginWaiters.splice(0).forEach(f=>f(false));if(e&&e.type==="popup_failed_to_open")toast("登入視窗被擋住了，請再按一次「連線 Drive」")}});
  gisReady=true;
}
async function login(interactive){
  if(CLIENT_ID.startsWith("__")){toast("尚未設定 Google 用戶端 ID");return false}
  try{await initGis()}catch{toast("連不到 Google，請確認網路");return false}
  return new Promise(res=>{loginWaiters.push(res);tokenClient.requestAccessToken({prompt:interactive?"":"none"})});
}
function hasToken(){return token&&Date.now()<tokenExp}
try{const t=JSON.parse(sessionStorage.getItem("tok")||"null");if(t&&Date.now()<t.tokenExp){token=t.token;tokenExp=t.tokenExp}}catch{}

/* ============ Google Drive API ============ */
class AuthErr extends Error{}
async function gfetch(url,opts={}){
  if(!hasToken()){token=null;throw new AuthErr("no token")}
  const r=await fetch(url,{...opts,headers:{...(opts.headers||{}),Authorization:"Bearer "+token}});
  if(r.status===401){token=null;try{sessionStorage.removeItem("tok")}catch{};throw new AuthErr("401")}
  if(!r.ok){let m="";try{m=(await r.json()).error.message}catch{};const e=new Error(m||("HTTP "+r.status));e.status=r.status;throw e}
  return r.status===204?null:r.json();
}
const API="https://www.googleapis.com/drive/v3/files", UP="https://www.googleapis.com/upload/drive/v3/files";
function createFolder(name,parent){return gfetch(API+"?fields=id,webViewLink",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,mimeType:"application/vnd.google-apps.folder",parents:parent?[parent]:undefined})})}
function uploadFile(meta,blob){const b="sitecam"+uid();
  const body=new Blob([`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: ${blob.type||"application/octet-stream"}\r\n\r\n`,blob,`\r\n--${b}--`]);
  return gfetch(UP+"?uploadType=multipart&fields=id,webViewLink",{method:"POST",headers:{"Content-Type":"multipart/related; boundary="+b},body})}
function patchFile(id,meta){return gfetch(`${API}/${id}?fields=id`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(meta)})}
async function fileAlive(id){try{const f=await gfetch(`${API}/${id}?fields=id,trashed`);return f&&!f.trashed}catch(e){if(e instanceof AuthErr)throw e;if(e.status===404)return false;throw e}}
async function rootFolder(){
  let id=await kvGet("rootId");
  if(id&&await fileAlive(id)){
    if(await kvGet("rootName")!==ROOT_FOLDER_NAME){try{await patchFile(id,{name:ROOT_FOLDER_NAME});await kvSet("rootName",ROOT_FOLDER_NAME)}catch(e){if(e instanceof AuthErr)throw e}}
    return id;
  }
  // 也找舊名稱「場勘相機」的資料夾，找到就改名沿用
  const q=encodeURIComponent(`(name='${ROOT_FOLDER_NAME}' or name='場勘相機') and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const r=await gfetch(`${API}?q=${q}&fields=files(id)&pageSize=1`);
  if(r.files&&r.files[0]){id=r.files[0].id;try{await patchFile(id,{name:ROOT_FOLDER_NAME})}catch(e){if(e instanceof AuthErr)throw e}}
  else id=(await createFolder(ROOT_FOLDER_NAME)).id;
  await kvSet("rootId",id);await kvSet("rootName",ROOT_FOLDER_NAME);return id;
}
async function siteFolder(site){
  if(site.driveFolderId&&await fileAlive(site.driveFolderId))return site.driveFolderId;
  const f=await createFolder(safeTitle(`${site.name}_${site.date}`),await rootFolder());
  site.driveFolderId=f.id;site.driveFolderUrl=f.webViewLink||`https://drive.google.com/drive/folders/${f.id}`;await dbPut("sites",site);
  if(curSite&&curSite.id===site.id){curSite=site;renderSiteHead()}
  return f.id;
}
function fileTitle(p){return `#${String(p.no).padStart(3,"0")}_${safeTitle(p.note||"無備註").slice(0,30)}.jpg`}
function descText(p){return [p.note||"（無備註）",`拍攝時間：${fmtTime(p.takenAt)}`,p.lat!=null?`${twdLabel(p)}\nGPS：${llText(p)}${p.acc?`（±${Math.round(p.acc)}m）`:""}\n${mapUrl(p)}`:"GPS：無"].join("\n")}

/* ============ 同步 ============ */
async function sync(){
  if(syncing){syncAgain=true;return}
  if(!navigator.onLine||CLIENT_ID.startsWith("__"))return;
  if(!hasToken()){
    if(await kvGet("authed")){const ok=await Promise.race([login(false),new Promise(r=>setTimeout(()=>r(false),8000))]);if(!ok){renderBanners();setStatus();return}}
    else{renderBanners();setStatus();return}
  }
  syncing=true;setStatus();
  try{
    // 1. 刪除（移到 Drive 垃圾桶）
    for(const t of await dbAll("tomb")){try{await patchFile(t.driveId,{trashed:true})}catch(e){if(e instanceof AuthErr)throw e;if(e.status!==404)continue}await dbDel("tomb",t.id)}
    const allSites=await dbAll("sites");
    for(const site of allSites){
      const list=(await dbBySite(site.id)).sort((a,b)=>a.no-b.no);
      let changed=false;
      if(site.renamed&&site.driveFolderId){try{await patchFile(site.driveFolderId,{name:safeTitle(`${site.name}_${site.date}`)});site.renamed=false;await dbPut("sites",site)}catch(e){if(e instanceof AuthErr)throw e}}
      for(const p of list){
        if(!p.driveFileId&&p.blob){
          uploading.add(p.id);renderPhotos();
          try{const folder=await siteFolder(site);
            const f=await uploadFile({name:fileTitle(p),description:descText(p),parents:[folder]},p.blob);
            p.driveFileId=f.id;p.driveUrl=f.webViewLink||`https://drive.google.com/file/d/${f.id}/view`;p.metaDirty=false;p.contentDirty=false;p.err=null;
            // 上傳完成：把手機裡的原圖縮成 1280px 省空間
            try{const {img,url}=await loadImage(p.blob);p.blob=await toBlob(resize(img,1280),.8);p.slim=true;URL.revokeObjectURL(url)}catch{}
            if(p.orig){try{const {img,url}=await loadImage(p.orig);p.orig=await toBlob(resize(img,1280),.8);URL.revokeObjectURL(url)}catch{}}
            await dbPut("photos",p);changed=true;
          }catch(e){if(e instanceof AuthErr)throw e;p.err=e.message||"上傳失敗";await dbPut("photos",p)}
          finally{uploading.delete(p.id);await refreshCurrent()}
        }else if(p.driveFileId&&p.contentDirty&&p.blob){
          uploading.add(p.id);renderPhotos();
          try{await gfetch(`${UP}/${p.driveFileId}?uploadType=media&fields=id`,{method:"PATCH",headers:{"Content-Type":"image/jpeg"},body:p.blob});
            if(p.metaDirty)await patchFile(p.driveFileId,{name:fileTitle(p),description:descText(p)});
            p.contentDirty=false;p.metaDirty=false;
            try{const {img,url}=await loadImage(p.blob);p.blob=await toBlob(resize(img,1280),.8);p.slim=true;URL.revokeObjectURL(url)}catch{}
            await dbPut("photos",p);changed=true;
          }catch(e){if(e instanceof AuthErr)throw e;if(e.status===404){p.driveFileId=null;p.driveUrl=null;p.contentDirty=false;await dbPut("photos",p)}}
          finally{uploading.delete(p.id);await refreshCurrent()}
        }else if(p.driveFileId&&p.metaDirty){
          try{await patchFile(p.driveFileId,{name:fileTitle(p),description:descText(p)});p.metaDirty=false;await dbPut("photos",p);changed=true}
          catch(e){if(e instanceof AuthErr)throw e;if(e.status===404){p.driveFileId=null;p.driveUrl=null;await dbPut("photos",p)}}
        }
      }
      // 2. 備註清單（Google 試算表）
      if((changed||site.sheetDirty)&&list.length&&list.every(p=>p.driveFileId)){
        try{const folder=await siteFolder(site);
          const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
          const rows=[["編號","拍攝時間","備註","TWD97 X","TWD97 Y","緯度","經度","GPS誤差(公尺)","地圖連結","Drive 照片"].map(q).join(",")].concat(list.map(p=>{const t=twd(p);return [p.no,fmtTime(p.takenAt),p.note,t?t.x.toFixed(3):"",t?t.y.toFixed(3):"",p.lat??"",p.lng??"",p.acc?Math.round(p.acc):"",p.lat!=null?mapUrl(p):"",p.driveUrl||""].map(q).join(",")}));
          const f=await uploadFile({name:safeTitle(`${site.name}_備註清單`),mimeType:"application/vnd.google-apps.spreadsheet",parents:[folder]},new Blob([rows.join("\n")],{type:"text/csv"}));
          const old=site.driveSheetId;site.driveSheetId=f.id;site.driveSheetUrl=f.webViewLink;site.sheetDirty=false;await dbPut("sites",site);
          if(old&&old!==f.id)patchFile(old,{trashed:true}).catch(()=>{});
        }catch(e){if(e instanceof AuthErr)throw e}
      }
    }
  }catch(e){if(e instanceof AuthErr){token=null;renderBanners();toast("Google Drive 登入已過期，請按「連線 Drive」")}}
  finally{syncing=false;await reloadSites();await refreshCurrent();setStatus();if(syncAgain){syncAgain=false;setTimeout(sync,500)}}
}
setInterval(()=>{if(navigator.onLine&&hasToken())sync()},60000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")sync()});

/* ============ 場勘列表 ============ */
async function reloadSites(){
  sites=(await dbAll("sites")).sort((a,b)=>b.createdAt-a.createdAt);
  const all=await dbAll("photos");
  for(const s of sites){const l=all.filter(p=>p.siteId===s.id).sort((a,b)=>a.no-b.no);s.count=l.length;s.pendingCount=l.filter(p=>!p.driveFileId).length;s.cover=l.length?l[l.length-1].thumb:null}
  renderSites();setStatus();
}
function renderSites(){
  const el=$("#sites");

  const c=eCtx;c.drawImage(ed.img,0,0,ed.w,ed.h);

  if(ed.caption){c.fillStyle="#fff";c.fillRect(0,ed.h,ed.w,barH);c.fillStyle="#111";c.textBaseline="top";
    lines.forEach((l,k)=>{c.font=`${k===0?"700 ":""}${fs}px ${FONT}`;c.fillText(l,fs*0.8,ed.h+fs*0.45+k*fs*1.35)})}

$("#cAgain").onclick=async()=>{stopMics();if(!commit())return;const items=queue;queue=[];
  const files=autoAlbum?queueFiles(items):[];
  if(files.length){const sh=shareToAlbum(files);close("#composeSheet");await saveAll(items);const r=await sh;toast(r==="ok"?"已存到相簿，按「拍照」繼續下一張":"按「拍照」繼續下一張");return}
  close("#composeSheet");await saveAll(items);$("#camInput").value="";$("#camInput").click()};
async function saveAll(items){
  const site=await dbGet("sites",curSite.id);
  for(const it of items){
    try{
      const full=await toBlob(resize(it.img,2048),.85);const thumb=resize(it.img,320).toDataURL("image/jpeg",.72);
      const no=Math.max(site.nextNo||1,photos.reduce((m,p)=>Math.max(m,p.no),0)+1);site.nextNo=no+1;
      const orig=it.origImg?await toBlob(resize(it.origImg,2048),.85):null;
      const p={id:uid(),siteId:site.id,no,note:it.note,takenAt:it.time,orig,lat:it.lat??null,lng:it.lng??null,acc:it.acc??null,gpsSrc:it.lat!=null?it.gpsSrc:null,thumb,blob:full,createdAt:Date.now(),driveFileId:null};
      await dbPut("photos",p);photos.push(p);URL.revokeObjectURL(it.url);
    }catch(e){toast("儲存失敗："+(e&&e.name==="QuotaExceededError"?"手機空間不足":"請再試一次"))}
  }
  site.sheetDirty=true;await dbPut("sites",site);curSite=site;
  await refreshCurrent();toast(items.length>1?`已儲存 ${items.length} 張`:`#${photos[photos.length-1].no} 已儲存`);sync();
}

/* ============ 照片詳細 ============ */
let detailId=null;
function openDetail(id){detailId=id;showDetail(true);open("#detailSheet")}
function showDetail(reset){
  const l=ordered(),i=l.findIndex(p=>p.id===detailId);if(i<0){close("#detailSheet");return}const p=l[i];
  $("#dNo").textContent="#"+p.no;$("#dTime").textContent=fmtTime(p.takenAt);$("#dImg").src=blobUrl(p);
  $("#dGpsLine").innerHTML=gpsHtml(p.lat!=null?p:null);coordHtml(p.lat!=null?p:null,$("#dCoord"));
  $("#dRestore").classList.toggle("hidden",!p.orig);
  $("#dDriveLine").innerHTML=p.driveUrl?`☁ <a href="${p.driveUrl}" target="_blank" rel="noopener">在 Google Drive 開啟原圖</a>`:driveBadge(p);
  if(reset){$("#dNote").value=p.note||"";$("#dGps").value=llText(p)}
  $("#dPrev").style.opacity=i<=0?.3:1;$("#dNext").style.opacity=i>=l.length-1?.3:1;
}
async function sourceForEdit(p){
  if(p.slim&&p.driveFileId&&navigator.onLine&&hasToken()){
    try{const r=await fetch(`${API}/${p.driveFileId}?alt=media`,{headers:{Authorization:"Bearer "+token}});if(r.ok)return await r.blob()}catch{}
  }
  return p.blob;
}
async function setPhotoImage(p,blob){
  const {img,url}=await loadImage(blob);p.thumb=resize(img,320).toDataURL("image/jpeg",.72);URL.revokeObjectURL(url);
  p.blob=blob;p.slim=false;if(p.driveFileId)p.contentDirty=true;
  await dbPut("photos",p);const s=await dbGet("sites",p.siteId);s.sheetDirty=true;await dbPut("sites",s);
  await refreshCurrent();showDetail(false);sync();
}
$("#dMark").onclick=async()=>{const p=photos.find(x=>x.id===detailId);if(!p)return;if(!(await saveDetail()))return;
  toast("準備照片中…");const src=await sourceForEdit(p);if(!src){toast("找不到照片");return}
  const {img,url}=await loadImage(src);const out=await openEditor(img,infoFor(p));URL.revokeObjectURL(url);if(!out)return;
  if(!p.orig)p.orig=src;await setPhotoImage(p,out);toast(p.driveFileId?"已標示，會更新 Drive 上的照片":"已標示")};
$("#dSaveAlbum").onclick=()=>{const p=photos.find(x=>x.id===detailId);if(!p)return;
  const files=[new File([p.blob],albumName(p.no),{type:"image/jpeg"})];
  if(p.orig&&p.orig!==p.blob)files.push(new File([p.orig],albumName(p.no).replace(".jpg","_原圖.jpg"),{type:"image/jpeg"}));
  shareToAlbum(files).then(r=>{if(r==="ok")toast(p.slim?"已存到相簿（手機內為縮小版，原尺寸在 Drive）":"已存到相簿")})};
$("#dRestore").onclick=async()=>{const p=photos.find(x=>x.id===detailId);if(!p||!p.orig)return;
  if(!(await confirmBox("還原原圖？","照片上的標示會移除。","還原")))return;const o=p.orig;delete p.orig;await setPhotoImage(p,o);toast("已還原原圖")};
async function saveDetail(){
  const p=photos.find(x=>x.id===detailId);if(!p)return true;
  const note=$("#dNote").value.trim(),ll=parseLL($("#dGps").value);if(ll===undefined){toast("座標格式不對，例：24.9575, 121.2253");return false}
  const nl=ll?ll.lat:null,ng=ll?ll.lng:null;let ch=false;
  if(note!==(p.note||"")){p.note=note;ch=true}
  if(nl!==p.lat||ng!==p.lng){p.lat=nl;p.lng=ng;p.acc=null;p.gpsSrc=ll?"manual":null;ch=true}
  if(ch){p.metaDirty=true;await dbPut("photos",p);const s=await dbGet("sites",p.siteId);s.sheetDirty=true;await dbPut("sites",s);renderPhotos();sync()}
  return true;
}
async function step(d){stopMics();if(!(await saveDetail()))return;const l=ordered(),i=l.findIndex(p=>p.id===detailId)+d;if(i>=0&&i<l.length){detailId=l[i].id;showDetail(true)}}
$("#dPrev").onclick=()=>step(-1);$("#dNext").onclick=()=>step(1);
$("#dSave").onclick=async()=>{stopMics();if(await saveDetail()){close("#detailSheet");toast("已儲存")}};
$("#dDel").onclick=async()=>{const p=photos.find(x=>x.id===detailId);if(!p)return;
  if(!(await confirmBox(`刪除 #${p.no}？`,p.driveFileId?"會從手機刪除；Drive 上的那張會移到 Drive 垃圾桶（30 天內可救回）。":"這張還沒上傳到 Drive，刪除後無法復原。")))return;
  if(p.driveFileId)await dbPut("tomb",{id:uid(),driveId:p.driveFileId});
  await dbDel("photos",p.id);const s=await dbGet("sites",p.siteId);s.sheetDirty=true;await dbPut("sites",s);
  close("#detailSheet");await refreshCurrent();toast("已刪除");sync()};

/* ============ 選單 / 匯出 ============ */
function download(name,blob){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
async function shareOrDownload(name,blob){const f=new File([blob],name,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name});return}catch(e){if(e.name==="AbortError")return}}download(name,blob)}
function baseName(){return safeTitle(`${curSite.name}_${curSite.date}`)}
function plainText(){const L=[`【${curSite.name}】`];if(curSite.address)L.push("地點："+curSite.address);L.push("日期："+curSite.date,`照片：${photos.length} 張`,"");photos.forEach(p=>L.push(`#${p.no}（${fmtTime(p.takenAt)}）${p.note||"（無備註）"}${p.lat!=null?`\n   ${twdLabel(p)}\n   📍 ${llText(p)} ${mapUrl(p)}`:""}`));if(curSite.driveFolderUrl)L.push("","照片資料夾："+curSite.driveFolderUrl);return L.join("\n")}
function csvBlob(){const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;return new Blob(["\ufeff"+[["編號","拍攝時間","備註","TWD97 X","TWD97 Y","緯度","經度","地圖連結","Drive 照片"].map(q).join(",")].concat(photos.map(p=>{const t=twd(p);return [p.no,fmtTime(p.takenAt),p.note,t?t.x.toFixed(3):"",t?t.y.toFixed(3):"",p.lat??"",p.lng??"",p.lat!=null?mapUrl(p):"",p.driveUrl||""].map(q).join(",")})).join("\r\n")],{type:"text/csv"})}
async function reportBlob(){const parts=[];for(const p of photos){let src=p.thumb;try{if(p.blob){const {img,url}=await loadImage(p.blob);src=resize(img,1280).toDataURL("image/jpeg",.78);URL.revokeObjectURL(url)}}catch{}
  parts.push(`<div class="it"><img src="${src}"><div><h3>#${p.no}</h3><p class="t">${esc(fmtTime(p.takenAt))}</p>${p.lat!=null?`<p class="t">${twdLabel(p)}</p><p class="t">📍 <a href="${mapUrl(p)}">${llText(p)}</a></p>`:""}<p class="n">${esc(p.note||"（無備註）")}</p></div></div>`)}
  return new Blob([`<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(curSite.name)} 場勘報告</title><style>body{font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;max-width:900px;margin:24px auto;padding:0 16px;color:#1b1f1d}h1{margin:0 0 4px}.m{color:#666;margin:0 0 20px}.it{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;padding:16px 0;border-top:1px solid #ddd;page-break-inside:avoid}.it img{width:100%;border-radius:6px}h3{margin:0;color:#0f6b5a}.t{color:#777;font-size:13px;margin:2px 0 6px}.n{white-space:pre-wrap;margin:6px 0 0}@media(max-width:600px){.it{grid-template-columns:1fr}}</style></head><body><h1>${esc(curSite.name)}</h1><p class="m">${esc([curSite.address,curSite.date,photos.length+" 張照片"].filter(Boolean).join(" · "))}</p>${parts.join("")}</body></html>`],{type:"text/html"})}
$("#moreBtn").onclick=()=>{
  const items=[];
  if(curSite){
    $("#menuTitle").textContent=curSite.name;
    if(curSite.driveFolderUrl)items.push(`<a href="${curSite.driveFolderUrl}" target="_blank" rel="noopener">📂 開啟 Drive 資料夾<small>照片原圖都在這裡</small></a>`);
    if(curSite.driveSheetUrl)items.push(`<a href="${curSite.driveSheetUrl}" target="_blank" rel="noopener">📊 開啟備註清單（Google 試算表）</a>`);
    items.push(`<button data-act="copy">複製全部備註<small>貼到 LINE、Email</small></button>`,`<button data-act="coords">複製全部 TWD97 座標<small>每行：編號,X,Y,備註，可貼到 Excel</small></button>`,`<button data-act="csv">匯出 CSV<small>Excel 可直接開啟</small></button>`,`<button data-act="report">匯出場勘報告（HTML）<small>含照片，可分享或列印成 PDF</small></button>`,`<button data-act="edit">編輯名稱 / 地址 / 日期</button>`,`<button data-act="delsite" style="color:var(--warn)">刪除整個場勘</button>`);
  }else $("#menuTitle").textContent="工程相機";
  if(!CLIENT_ID.startsWith("__"))items.push(hasToken()?`<button data-act="sync">立即同步到 Drive</button>`:`<button data-act="login">連線 Google Drive</button>`);
  items.push(`<button data-act="album">拍照後自動存到手機相簿：${autoAlbum?"開":"關"}<small>${autoAlbum?"按「儲存」時跳出選單，點「儲存影像」即可。點此關閉":"點此開啟"}</small></button>`);
  items.push(`<button data-act="help">加到 iPhone 主畫面的方法</button>`);
  $("#menuItems").innerHTML=items.join("");open("#menuSheet");
  $("#menuItems").querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>menuAct(b.dataset.act));
};
async function menuAct(a){
  close("#menuSheet");
  if(a==="copy"){try{await navigator.clipboard.writeText(plainText());toast("已複製全部備註")}catch{toast("無法複製")}}
  if(a==="coords"){const L=photos.filter(p=>p.lat!=null).map(p=>`${p.no},${twdText(p)},${(p.note||"").replace(/[\r\n,]+/g," ")}`);if(!L.length){toast("這個場勘沒有座標");return}copyText(L.join("\n"),`已複製 ${L.length} 筆 TWD97 座標`)}
  if(a==="csv")shareOrDownload(baseName()+"_備註.csv",csvBlob());
  if(a==="report"){toast("產生報告中…");shareOrDownload(baseName()+"_場勘報告.html",await reportBlob())}
  if(a==="edit"){editingSite=curSite;$("#siteSheetTitle").textContent="編輯場勘";$("#sSave").textContent="儲存";$("#sName").value=curSite.name;$("#sAddr").value=curSite.address||"";$("#sDate").value=curSite.date;open("#siteSheet")}
  if(a==="delsite"){const pend=photos.filter(p=>!p.driveFileId).length;
    if(!(await confirmBox(`刪除「${curSite.name}」？`,`會從手機刪除 ${photos.length} 張照片與備註${pend?`（其中 ${pend} 張還沒上傳，會永久消失）`:""}；Drive 上的資料夾會移到 Drive 垃圾桶。`)))return;
    for(const p of photos)await dbDel("photos",p.id);if(curSite.driveFolderId)await dbPut("tomb",{id:uid(),driveId:curSite.driveFolderId});await dbDel("sites",curSite.id);location.hash="";toast("已刪除場勘");sync()}
  if(a==="album"){autoAlbum=!autoAlbum;try{localStorage.setItem("autoAlbum",autoAlbum?"on":"off")}catch{}toast(autoAlbum?"已開啟：拍照後自動存到相簿":"已關閉自動存到相簿")}
  if(a==="login")login(true);
  if(a==="sync"){toast("同步中…");sync()}
  if(a==="help")confirmBox("加到主畫面","用 Safari 開啟本頁 → 按下方「分享」→「加入主畫面」→「加入」。之後從主畫面的「工程相機」圖示開啟，就像一般 App。","知道了").then(()=>{});
}

/* ============ 啟動 ============ */
(async()=>{
  try{idb=await openDB()}catch{document.body.innerHTML='<p style="padding:24px">這個瀏覽器無法儲存資料（可能是無痕模式）。請用一般模式的 Safari 開啟。</p>';return}
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
  await reloadSites();renderBanners();await route();setStatus();
  if(!CLIENT_ID.startsWith("__"))initGis().catch(()=>{}).then(()=>sync());
  window.addEventListener("beforeunload",e=>{if(uploading.size){e.preventDefault();e.returnValue=""}});
})();
})();
</script>
</body>
</html>
